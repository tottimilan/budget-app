<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparador Litro vs Galón</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Comparador de coste: Litro vs Galón</h1>
    <p class="subtitle">Ingresa el coste por litro y por galón para ver cuál conviene más por litro.</p>

    <form id="compare-form" class="form">
      <label>
        Coste de 1 litro
        <input id="cost-liter" type="number" min="0" step="0.0001" placeholder="Ej: 1.45" required />
      </label>

      <label>
        Coste de 1 galón
        <input id="cost-gallon" type="number" min="0" step="0.0001" placeholder="Ej: 5.20" required />
      </label>

      <button type="submit">Comparar</button>
    </form>

    <section id="results" class="results" aria-live="polite">
      <p><strong>Coste por litro (desde galón):</strong> <span id="gallon-per-liter">—</span></p>
      <p><strong>Diferencia por litro:</strong> <span id="difference">—</span></p>
      <p id="winner" class="winner">Completa los campos para comparar.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
